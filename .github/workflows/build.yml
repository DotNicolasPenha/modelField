name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - run: wails build -o ModelField-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: ModelField-linux-amd64
          path: build/bin/ModelField-linux-amd64

  build-windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev gcc-mingw-w64-x86-64
      - run: CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=x86_64-w64-mingw32-gcc wails build -o ModelField-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ModelField-windows-amd64
          path: build/bin/ModelField-windows-amd64.exe

  build-macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - run: wails build -o ModelField-darwin-amd64
      - run: cd build/bin && mv ModelField-darwin-amd64.app ModelField-darwin-amd64.app.bak && zip -r ModelField-darwin-amd64.zip ModelField-darwin-amd64.app.bak && rm -rf ModelField-darwin-amd64.app.bak
      - uses: actions/upload-artifact@v4
        with:
          name: ModelField-darwin-amd64
          path: build/bin/ModelField-darwin-amd64.zip

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ModelField-linux-amd64/ModelField-*
            ModelField-windows-amd64/ModelField-*
            ModelField-darwin-amd64/ModelField-*
