name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            goarch: amd64
          - os: windows-latest
            platform: windows
            goarch: amd64
          - os: macos-latest
            platform: darwin
            goarch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Windows dependencies
        if: matrix.platform == 'windows'
        run: choco install mingw gcc -y

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: wails build -o ModelField-linux-amd64

      - name: Build (macOS)
        if: matrix.platform == 'darwin'
        run: wails build -o ModelField-darwin-arm64

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: wails build -o ModelField-windows-amd64.exe

      - name: List build output
        shell: bash
        run: ls -la build/bin/ 2>/dev/null || echo "build/bin not found"

      - name: Package macOS
        if: matrix.platform == 'darwin'
        working-directory: build/bin
        run: |
          ls -la
          zip -r ModelField-darwin-arm64.zip ModelField-darwin-arm64.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModelField-${{ matrix.platform }}-${{ matrix.goarch }}
          path: build/bin/ModelField-*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded files
        run: find . -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ModelField-linux-amd64/ModelField-*
            ModelField-windows-amd64/ModelField-*
            ModelField-darwin-arm64/ModelField-*
